{% extends "base.html" %}
{% block content %}

<section class="text-center py-10">
  <h1 class="text-4xl font-bold text-ink-heading">Find money the state owes you.</h1>
  <p class="mt-3 text-lg text-ink-muted max-w-2xl mx-auto">
    We check California's unclaimed property database for funds in your name.
    Free. Takes 10 seconds.
  </p>
</section>

<section class="bg-white rounded-card shadow-card border border-gray-100 p-8 max-w-2xl mx-auto">
  <form
    hx-post="/search"
    hx-target="#results"
    hx-swap="innerHTML"
    class="grid grid-cols-2 gap-4"
  >
    <div>
      <label class="block text-sm font-medium text-ink-heading mb-1">First name</label>
      <input name="first_name" required class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent">
    </div>
    <div>
      <label class="block text-sm font-medium text-ink-heading mb-1">Last name</label>
      <input name="last_name" required class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent">
    </div>
    <div>
      <label class="block text-sm font-medium text-ink-heading mb-1">Date of birth</label>
      <input name="dob" type="date" class="w-full border border-gray-300 rounded-md px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium text-ink-heading mb-1">Current ZIP</label>
      <input name="zip" class="w-full border border-gray-300 rounded-md px-3 py-2">
    </div>
    <div class="col-span-2">
      <button type="submit" class="w-full bg-cta text-white font-semibold py-3 rounded-full hover:bg-cta-dark transition">
        Search California records
      </button>
    </div>
  </form>
</section>

<section id="results" class="mt-10"></section>

{% endblock %}
